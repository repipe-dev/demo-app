name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# AWS wiring gate: with AWS_ROLE_ARN set (repo secret), the OIDC + ECR
# push + deploy steps run for real. Without it, everything that CAN run
# runs — tests, docker build — and AWS-dependent steps skip cleanly.
# This is the same shape used on real migrations: no static keys anywhere.
env:
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  build-and-test:
    # In the migration case study (MIGRATION.md §2) this job targets
    # [self-hosted, docker] — warm caches, existing hardware. This public
    # demo has no runner fleet, so it uses hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .[dev]

      - name: Test
        run: pytest -v --junitxml=results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: results/junit.xml

  container:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write           # OIDC — no static AWS keys, ever
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Login to ECR
        if: env.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (and push when AWS wiring exists)
        uses: docker/build-push-action@v6
        with:
          push: ${{ env.AWS_ROLE_ARN != '' }}
          tags: |
            012345678901.dkr.ecr.eu-central-1.amazonaws.com/demo-app:${{ github.run_number }}
            012345678901.dkr.ecr.eu-central-1.amazonaws.com/demo-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wiring note
        if: env.AWS_ROLE_ARN == ''
        run: |
          echo "Docker image built successfully."
          echo "ECR push + deploy skipped: AWS_ROLE_ARN repo secret not set"
          echo "(this repo ships with placeholder ARNs — see MIGRATION.md §3)."

  deploy-staging:
    needs: container
    if: github.ref == 'refs/heads/main' && env.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: staging          # protection rules: reviewers + main-only
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Update image
        run: |
          kubectl -n demo-staging set image deploy/demo-app \
            demo-app=012345678901.dkr.ecr.eu-central-1.amazonaws.com/demo-app:${{ github.run_number }}
          kubectl -n demo-staging rollout status deploy/demo-app --timeout=120s
