[project]
name = "demo-app"
version = "0.1.0"
description = "Migration showcase app — same app, two CI systems"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi[standard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
